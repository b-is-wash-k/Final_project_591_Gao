# Nav2 parameters for ONE robot. launch/navigation.launch.py loads this file once per
# robot in config/scenario.yaml and puts it under the robot's namespace (robot1, robot2, ...).
#
# Localization: none. The simulator's wheel odometry is exact enough for these short runs, so
# a fixed transform map -> odom (the robot's start pose) is published instead of AMCL. The
# "map" frame is the Gazebo world frame, so goals use world coordinates.
#
# Map: none. Both costmaps are built from the robot's own laser scan only. Unseen space is
# free, so a path may be planned through a room nobody has scanned yet. A closed gate is
# seen by the laser and blocks the path; an open gate (panel lifted above the laser) does not.
# The global costmap window (origin and size) is set by the launch file from the scenario's
# room bounds.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

controller_server:
  ros__parameters:
    controller_frequency: 15.0
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12        # well inside a switch pad's 0.30 m on-pad radius
      yaw_goal_tolerance: 6.28       # any final heading
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.26
      lookahead_dist: 0.5
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.7
      regulated_linear_scaling_min_speed: 0.06
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.4
      max_angular_accel: 1.2
      transform_tolerance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.22
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.38
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: false
      # origin_x, origin_y, width, height: set by launch/navigation.launch.py from the room bounds
      resolution: 0.05
      robot_radius: 0.22
      track_unknown_space: false     # unseen cells are free
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.38
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.3
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: [spin, backup, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    wait: {plugin: nav2_behaviors::Wait}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    enable_stamped_cmd_vel: false
